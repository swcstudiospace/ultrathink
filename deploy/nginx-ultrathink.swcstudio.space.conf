# Installed on the VPS as /etc/nginx/sites-available/ultrathink.swcstudio.space (symlinked into sites-enabled).
# Certificate: /etc/letsencrypt/live/ultrathink.swcstudio.space (certbot webroot, auto-renews).
# The upstream is the app's TLS listener on 127.0.0.1:8795 (mTLS). nginx presents the edge client leaf and verifies the app leaf against ca.pem.
# Leaves last 24 h; ultrathink-cert-renew.timer reloads nginx when it renews the edge leaf, so no manual reload is needed then.
# Cloudflare SSL mode must be Full (strict). Keep this file and the installed copy in sync.
# Validate before reload: nginx -t && systemctl reload nginx
# Rollback: rm /etc/nginx/sites-enabled/ultrathink.swcstudio.space && nginx -t && systemctl reload nginx
#
# This file is included in the http{} context, so the geo and limit_*_zone blocks below sit at file level.
#
# Cloudflare ranges: fetched 2026-10-18 from https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6.
# They appear twice below (set_real_ip_from lines inside the 443 server, and the geo block). Both lists must match.
# How to refresh (Cloudflare announces changes at https://www.cloudflare.com/ips/ ; check about quarterly):
#   curl -fsS https://www.cloudflare.com/ips-v4; echo; curl -fsS https://www.cloudflare.com/ips-v6
#   For each CIDR: add `set_real_ip_from <cidr>;` in the server block and `<cidr> 1;` in the geo block,
#   remove CIDRs that disappeared, update the fetch date above, then nginx -t && systemctl reload nginx.
#   Generator for both lists:
#     for r in $(curl -fsS https://www.cloudflare.com/ips-v4; echo; curl -fsS https://www.cloudflare.com/ips-v6); do
#       echo "set_real_ip_from $r;"; done
#     for r in $(curl -fsS https://www.cloudflare.com/ips-v4; echo; curl -fsS https://www.cloudflare.com/ips-v6); do
#       echo "    $r 1;"; done
# Verify: curl -sS -o /dev/null -w '%{http_code}\n' https://ultrathink.swcstudio.space/healthz   (200 through Cloudflare)
#         curl -sS --resolve ultrathink.swcstudio.space:443:187.77.130.10 https://ultrathink.swcstudio.space/healthz   (403 direct)

# 1 when the TCP peer is a Cloudflare edge address. $realip_remote_addr is the peer before real_ip rewrites
# $remote_addr, so a direct client cannot influence it by sending CF-Connecting-IP.
geo $realip_remote_addr $ultrathink_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Zones key on $binary_remote_addr, which is the real client address once real_ip has run (not a Cloudflare edge IP).
# Rates are per client address; bursts are served immediately (nodelay) and then refused with 429.
limit_req_zone  $binary_remote_addr zone=ultrathink_login:10m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=ultrathink_oauth:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=ultrathink_mcp:10m   rate=120r/m;
limit_conn_zone $binary_remote_addr zone=ultrathink_conn:10m;

# Upstream: the app's TLS listener on loopback. The proxy_ssl_* directives in the 443 server block verify and authenticate it.
upstream ultrathink_app {
    server 127.0.0.1:8795;
}

# Security headers have one source: the app, which sets them on every response it generates (router.ts and oauth.ts).
# nginx adds a header only where the upstream response did not carry it: its own 403, 404 and 429 replies, and any
# proxied reply without it. An empty map value emits nothing. The fallback values are the buildSecurityHeaders()
# output for router.ts API_HEADER_CONFIG.
map $upstream_http_strict_transport_security $ut_hsts {
    ""      "max-age=31536000; includeSubDomains";
    default "";
}
map $upstream_http_x_content_type_options $ut_xcto {
    ""      "nosniff";
    default "";
}
map $upstream_http_referrer_policy $ut_referrer {
    ""      "no-referrer";
    default "";
}
map $upstream_http_x_frame_options $ut_xfo {
    ""      "DENY";
    default "";
}
map $upstream_http_content_security_policy $ut_csp {
    ""      "default-src 'none'; frame-ancestors 'none'";
    default "";
}
map $upstream_http_permissions_policy $ut_pp {
    ""      "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
    default "";
}

server {
    listen 187.77.130.10:80;
    server_name ultrathink.swcstudio.space;
    server_tokens off;

    # Stays open to everyone: certbot validation and the redirect do not go through Cloudflare's address space.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://ultrathink.swcstudio.space$request_uri;
    }
}

server {
    listen 187.77.130.10:443 ssl http2;
    server_name ultrathink.swcstudio.space;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ultrathink.swcstudio.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultrathink.swcstudio.space/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # TLS settings are inlined (Mozilla "intermediate") instead of including certbot's options-ssl-nginx.conf:
    # that file sets ssl_protocols too, and a second ssl_protocols in the same block is a configuration error.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ultrathink_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Trust CF-Connecting-IP only when the TCP peer is a Cloudflare address (see the refresh notes at the top).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Slow-header and slow-body clients are dropped early; nginx buffers request bodies, so the app never sees them.
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 16k;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn ultrathink_conn 20;

    default_type application/json;

    # Only Cloudflare may reach this vhost. A direct hit on the origin IP skips the Cloudflare WAF and would also
    # make per-client limits meaningless. Local checks go to 127.0.0.1:8795 directly, not through this vhost.
    # (Authenticated Origin Pulls is an optional second layer; see docs/ops/runbook-ultrathink.md.)
    if ($ultrathink_from_cloudflare = 0) {
        return 403 '{"error":"forbidden"}';
    }

    # Security headers have one source, the app; the maps above hold the fallbacks. Each add_header here emits its
    # fallback only when the upstream response did not set that header, so a proxied reply never gets a second copy.
    add_header Strict-Transport-Security $ut_hsts always;
    add_header X-Content-Type-Options $ut_xcto always;
    add_header Referrer-Policy $ut_referrer always;
    add_header X-Frame-Options $ut_xfo always;
    add_header Content-Security-Policy $ut_csp always;
    add_header Permissions-Policy $ut_pp always;
    add_header X-Request-Id $request_id always;

    # Only 502 and 504 (upstream down, restarting or timing out) are rewritten. A 503 is never generated by nginx here
    # (rate limits answer 429), so any 503 is the app's own, and its body (persistence_unavailable, readyz not_ready,
    # the OAuth temporarily_unavailable error, the consent error page) must reach the client untouched.
    proxy_intercept_errors on;
    error_page 502 504 = @unavailable;

    # Proxy settings shared by every location (inherited, since no location sets its own proxy_set_header).
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    # The app's TLS listener: nginx verifies its leaf against ca.pem and presents the edge leaf (SPIFFE edge/nginx).
    # A failed handshake surfaces as 502 and is rewritten to @unavailable below.
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate /etc/ultrathink/tls/ca.pem;
    proxy_ssl_certificate /etc/ultrathink/tls/edge/cert.pem;
    proxy_ssl_certificate_key /etc/ultrathink/tls/edge/key.pem;
    proxy_ssl_name 127.0.0.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.3;
    proxy_set_header Host $host;
    # $remote_addr is the real client here (real_ip). The app trusts X-Real-IP only from the loopback peer.
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite rather than append: a client-supplied X-Forwarded-For must not reach the app.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";
    # The app echoes the request id it was given; hide it so the client gets exactly one X-Request-Id (added above).
    proxy_hide_header X-Request-Id;

    location = /login {
        limit_req zone=ultrathink_login burst=5 nodelay;
        proxy_pass https://ultrathink_app;
    }

    location ~ ^/ultrathink(/|$) {
        # The app accepts a 1 MiB body (MAX_BODY_BYTES), so nginx must not cut a smaller request first.
        client_max_body_size 1m;
        proxy_pass https://ultrathink_app;
    }

    location = /healthz {
        proxy_pass https://ultrathink_app;
    }

    location = /mcp {
        limit_req zone=ultrathink_mcp burst=60 nodelay;
        client_max_body_size 1m;
        # ultrathink_result long-polls for up to 45 s; keep the proxy timeout above that and below Cloudflare's 100 s.
        proxy_read_timeout 75s;
        proxy_pass https://ultrathink_app;
    }

    location ~ ^/\.well-known/(oauth-protected-resource(/mcp)?|oauth-authorization-server|openid-configuration)$ {
        proxy_pass https://ultrathink_app;
    }

    location ~ ^/oauth/(authorize|token|register|revoke)$ {
        limit_req zone=ultrathink_oauth burst=20 nodelay;
        proxy_pass https://ultrathink_app;
    }

    location / {
        return 404 '{"error":"not_found"}';
    }

    # Named location: a single JSON body for an upstream that is down or timing out (502 and 504).
    # add_header here replaces inheritance from the server block, so the
    # security headers are repeated to keep them on this response.
    location @unavailable {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Request-Id $request_id always;
        return 503 '{"error":"unavailable"}';
    }
}
