name: Policy

# Policy as code: OPA checks over the workflows, the systemd units and the security headers. The OPA binary is
# downloaded by policy/check.sh and verified against the sha256 in policy/opa-pin.json before it runs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its superseded run; runs on main always finish.
concurrency:
  group: policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Using self-hosted runner on this machine (local) for CI (per user); was temporarily GitHub-hosted ubuntu-latest while diagnosing Railway Omega-CI.
# Runner label: self-hosted (or local-runner if registered with that).
jobs:
  policy:
    name: Policy checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check and evaluate policies
        run: bash policy/check.sh

      - name: Compliance summary
        run: bun policy/compliance-report.ts --root . >> "$GITHUB_STEP_SUMMARY"
