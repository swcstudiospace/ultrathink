name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its superseded run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Using self-hosted runner on this machine (local) for CI (per user). GitHub-hosted ubuntu-latest is used for PR checks; age/rsync are installed in the job below for hosted runners.
jobs:
  test:
    name: Check and test (Bun ${{ matrix.bun }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 1.2.x is the minimum in package.json "engines"; latest catches regressions early.
        bun: [1.2.x, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}

      # hosts/hermes and hosts/prime-agent need Python 3.10+; pin the minimum so newer syntax is caught.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      # The pool has no system Node; the minimum-Bun leg's npm install and any test that shells out to node use this one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      # ultrathink has no runtime dependencies; `bun install` only fetches type definitions for the type check.
      # bun.lock uses a lockfile format Bun 1.2 cannot read, so the minimum-Bun leg runs the tests without it.
      - name: Install dependencies
        if: matrix.bun == 'latest'
        run: bun install --frozen-lockfile

      # The policy and drift tests import the yaml package from node_modules. The minimum-Bun leg installs nothing (above),
      # so it gets only that package, at the version package.json pins, without writing package.json or any lockfile.
      - name: Install the policy test dependency (minimum-Bun leg)
        if: matrix.bun != 'latest'
        run: |
          npm install --no-save --no-package-lock "yaml@$(node -p "require('./package.json').devDependencies.yaml")"

      - name: Type check
        if: matrix.bun == 'latest'
        run: bun run check

      # services/ has its own tsconfig because the root one covers only src, hooks and scripts.
      - name: Type check (services)
        if: matrix.bun == 'latest'
        run: bun run check:services

      # Phase 77: Biome is the one lint and format tool. It is a dev dependency, so only the latest-Bun leg installs it.
      - name: Lint and format check (Biome)
        if: matrix.bun == 'latest'
        run: bun run lint

      # Job (e): format check limited to the .ts, .js and .json files this change adds or modifies. The full-tree Biome
      # step above is unchanged. Pull requests diff against the base branch; pushes diff against the previous commit.
      - name: Format check (changed files)
        if: matrix.bun == 'latest'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            range="HEAD~1 HEAD"
          else
            range="$(git hash-object -t tree /dev/null) HEAD"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR $range -- '*.ts' '*.js' '*.json')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed .ts, .js or .json files."
            exit 0
          fi
          bunx biome format --error-on-warnings --no-errors-on-unmatched "${files[@]}"

      # Phase 80: the dead-code gate (knip, exports and types). It runs on the latest-Bun leg with the Biome step.
      - name: Dead-code check (knip)
        if: matrix.bun == 'latest'
        run: bun run deadcode

      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      - name: Install age and rsync (GitHub-hosted runners)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rsync

      # Phase 74: the off-host round-trip and rsync tests skip silently when age or rsync is missing, so CI fails here
      # instead. GitHub-hosted runners use the install step above; the Omega CI runner image ships both.
      - name: Require age and rsync
        run: |
          for tool in age age-keygen rsync; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::$tool is not on PATH; add it to the Omega CI runner image" >&2
              exit 1
            fi
          done
          age --version
          rsync --version | head -n 1

      - name: Test
        run: bun test
        env:
          ULTRATHINK_SMOKE_SERVICE: "1"

      # A stale committed manifest fails the build: regenerate with `bun run gen:manifests` and commit the result.
      - name: Manifest drift
        run: |
          bun run gen:manifests
          git diff --exit-code -- plugin/generated
          test -z "$(git status --porcelain -- plugin/generated)"

      # Job (c): the plugin source must match plugin/schema/plugin-source.schema.json, and every generated manifest must
      # parse as JSON or YAML.
      - name: Schema validation (plugin source and manifests)
        run: bun tooling/schema/validate.ts

      - name: Core dependency boundary
        run: bun tooling/boundary/check-core-boundary.ts

      - name: Credential scan
        run: bun tooling/secret-scan/scan.ts core adapters conformance tools tooling plugin docs/plugin-research docs/install test/golden

      - name: Hermes bridge test
        run: python3 hosts/hermes/bridge_test.py

      - name: Prime Agent bridge test
        run: python3 hosts/prime-agent/bridge_test.py

  # Job (f): one matrix entry per adapter. `subject` is the describe name that conformance/<adapter>.conformance.test.ts
  # registers; the step filters on it with --test-name-pattern. The full test job above still runs every conformance test.
  conformance:
    name: Conformance (${{ matrix.adapter }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: claude-code
            subject: Claude Code plugin entry points
          - adapter: grok-build
            subject: Grok Build plugin command entry point
          - adapter: muse
            subject: Muse plugin entry points
          - adapter: hermes
            subject: Hermes plugin command entry point
          - adapter: prime-agent
            subject: Prime Agent skill entry point
          - adapter: omp
            subject: Omp host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Conformance (${{ matrix.adapter }})
        env:
          SUBJECT: ${{ matrix.subject }}
        run: bun test conformance --test-name-pattern "$SUBJECT"
