      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Generate release notes
        run: bun run release:notes
      - name: Create GitHub Release
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" --verify-tag --title "ultrathink ${TAG#v}" --notes-file RELEASE_NOTES.md "${flags[@]}" security-evidence/manifest.json security-evidence/audit.json security-evidence/licenses.json security-evidence/checks.json
