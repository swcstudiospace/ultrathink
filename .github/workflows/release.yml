# Creates a GitHub release when a semantic-version tag is pushed. It never publishes to a registry (the package
# is private) and only runs for tags like v1.5.0 or v1.5.0-rc.1; milestone tags such as v1.3 do not match.
# The tag is checked against package.json, every manifest and CHANGELOG.md, the gates run again, and the
# release notes are the tag's CHANGELOG.md section. Before the release is created, the job refuses a tag whose commit
# is not on origin/main, then gates on the required check runs for the tagged commit, the dependency audit and the
# license policy, and attaches that evidence (security-evidence/) to the release.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

# Runs on the Omega CI runner pool ([self-hosted, linux, x64, omega-ci], swcstudiospace/Omega-Prime docs/ci-runners.md).
jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 30
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # hosts/hermes and hosts/prime-agent need Python 3.10+; pin the minimum so newer syntax is caught.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      # The pool has no system Node; tests that shell out to node use this one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The runner has no git identity and git refuses to commit without one; set it in case a test shells out to git.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      # The tag reaches the script through the environment, never through the script text.
      - name: Verify tag, manifests and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release-check.ts --tag "$TAG"

      # The tagged commit must already be on main. origin/main is fetched here because persist-credentials is off, so the
      # token is passed through an extra header instead. Any failure stops the job before the release is created.
      - name: Verify tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'; then
            echo "::error::cannot fetch origin/main; release refused" >&2
            exit 1
          fi
          bun scripts/security-gate.ts ancestry --sha "$SHA"

      - name: Type check
        run: bun run check

      - name: Test
        run: bun test

      - name: Hermes bridge test
        run: python3 hosts/hermes/bridge_test.py

      - name: Prime Agent bridge test
        run: python3 hosts/prime-agent/bridge_test.py

      - name: Install plugin dependencies
        working-directory: plugins/omp-token-opt
        run: bun install --frozen-lockfile

      - name: Collect required check runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p security-evidence
          gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | {id,name,status,conclusion}' > security-evidence/checks.ndjson

      # Any non-zero exit fails the job before the release is created.
      - name: Security gate
        env:
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          bun scripts/security-gate.ts checks --input security-evidence/checks.ndjson --out security-evidence
          bun scripts/security-gate.ts audit --root . --root plugins/omp-token-opt --out security-evidence
          bun scripts/security-gate.ts licenses --root . --root plugins/omp-token-opt --out security-evidence
          bun scripts/security-gate.ts report --out security-evidence --sha "$SHA" --tag "$TAG"

      - name: Extract release notes
        run: bun scripts/release-check.ts --notes > RELEASE_NOTES.md

      # A tag with a hyphen (v1.5.0-rc.1) is a prerelease. --verify-tag aborts instead of creating a tag that is not already on the remote.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "ultrathink ${TAG#v}" --notes-file RELEASE_NOTES.md "${flags[@]}" security-evidence/manifest.json security-evidence/audit.json security-evidence/licenses.json security-evidence/checks.json
