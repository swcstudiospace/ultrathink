      - name: Upload release assets
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release upload "$TAG" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      # The runner has no git identity and git refuses to commit without one; set it in case a test shells out to git.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      # The tag reaches the script through the environment, never through the script text.
      - name: Verify tag, manifests and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release-check.ts --tag "$TAG"

      - name: Type check
        run: bun run check

      - name: Test
        run: bun test

      - name: Hermes bridge test
        run: python3 hosts/hermes/bridge_test.py

      - name: Prime Agent bridge test
        run: python3 hosts/prime-agent/bridge_test.py

      - name: Install plugin dependencies
        working-directory: plugins/omp-token-opt
        run: bun install --frozen-lockfile

      - name: Collect required check runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p security-evidence
          gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | {id,name,status,conclusion}' > security-evidence/checks.ndjson

      # Any non-zero exit fails the job before the release is created.
      - name: Security gate
        env:
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          bun scripts/security-gate.ts checks --input security-evidence/checks.ndjson --out security-evidence
          bun scripts/security-gate.ts audit --root . --root plugins/omp-token-opt --out security-evidence
          bun scripts/security-gate.ts licenses --root . --root plugins/omp-token-opt --out security-evidence
          bun scripts/security-gate.ts report --out security-evidence --sha "$SHA" --tag "$TAG"

      - name: Extract release notes
        run: bun scripts/release-check.ts --notes > RELEASE_NOTES.md

      # The evidence and the notes leave this read-only job as one artifact; the release job publishes them.
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: |
            security-evidence/
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  # The only job with a write scope. It runs no repository code and checks nothing out: it downloads the evidence that
  # `verify` produced and creates the release from it.
  release:
    name: Release ${{ github.ref_name }}
    needs: verify
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence

      # A tag with a hyphen (v1.5.0-rc.1) is a prerelease. --verify-tag aborts instead of creating a tag that is not already on the remote.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "ultrathink ${TAG#v}" --notes-file RELEASE_NOTES.md "${flags[@]}" security-evidence/manifest.json security-evidence/audit.json security-evidence/licenses.json security-evidence/checks.json
