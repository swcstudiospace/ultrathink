# Creates a GitHub release when a semantic-version tag is pushed. It never publishes to a registry (the package
# is private) and only runs for tags like v1.5.0 or v1.5.0-rc.1; milestone tags such as v1.3 do not match.
# The `verify` job checks the tag against package.json, every manifest and CHANGELOG.md, runs the gates again and writes
# the release notes from the tag's CHANGELOG.md section. Before anything is kept it refuses a tag whose commit is not on
# origin/main, then gates on the required check runs for the tagged commit, the dependency audit and the license policy,
# and keeps that evidence (security-evidence/). The `release` job is the only job with a write scope: it runs no
# repository code, downloads that evidence and creates the release.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

# Using self-hosted runner on this machine (local) for CI (per user); was temporarily GitHub-hosted ubuntu-latest while diagnosing Railway Omega-CI.
# Runner label: self-hosted (or local-runner if registered with that).
