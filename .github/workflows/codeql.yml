name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# A newer push to a pull request cancels its superseded scan; scans on main always finish.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on the Omega CI runner pool ([self-hosted, linux, x64, omega-ci], swcstudiospace/Omega-Prime
# docs/ci-runners.md), never on GitHub-hosted runners. Fork pull requests are skipped: fork code never reaches the pool.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # pull_request permits CodeQL uploads with fork read-only tokens; never run untrusted code via pull_request_target.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL's TypeScript extractor starts Node, and the pool image has no system Node (ci.yml sets it up the same
      # way). Without this the javascript-typescript leg fails with "Could not start Node.js".
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: "22.x"

      # The pool's tool cache (/opt/hostedtoolcache) is read-only, so this action cannot download its CodeQL
      # bundle at job time: the runner image ships the bundle this pin asks for (CodeQL 2.27.3). Bump the image
      # with the action (swcstudiospace/Omega-Prime deploy/ci-runner-desktop).
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
