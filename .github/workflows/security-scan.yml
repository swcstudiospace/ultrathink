name: Security scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Using self-hosted runner on this machine (local) for CI (per user); was temporarily GitHub-hosted ubuntu-latest while diagnosing Railway Omega-CI.
# Runner label: self-hosted (or local-runner if registered with that).
jobs:
  dependency-audit:
    name: Dependency audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # The gate runs from a worktree of origin/main, so a pull request cannot change the script that judges it.
      - name: Fetch origin/main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'; then
            echo "::error::cannot fetch origin/main; security gate refused" >&2
            exit 1
          fi
      - name: Create trusted gate copy
        run: git worktree add --detach "$RUNNER_TEMP/trusted-main" origin/main
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install plugin dependencies
        working-directory: plugins/omp-token-opt
        run: bun install --frozen-lockfile
      - name: Audit (high severity gate, both roots)
        run: bun "$RUNNER_TEMP/trusted-main/scripts/security-gate.ts" audit --root . --root plugins/omp-token-opt --out security-evidence
  license-policy:
    name: License policy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # The gate runs from a worktree of origin/main, so a pull request cannot change the script that judges it.
      - name: Fetch origin/main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'; then
            echo "::error::cannot fetch origin/main; security gate refused" >&2
            exit 1
          fi
      - name: Create trusted gate copy
        run: git worktree add --detach "$RUNNER_TEMP/trusted-main" origin/main
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install plugin dependencies
        working-directory: plugins/omp-token-opt
        run: bun install --frozen-lockfile
      - name: License policy (both roots)
        run: bun "$RUNNER_TEMP/trusted-main/scripts/security-gate.ts" licenses --root . --root plugins/omp-token-opt --out security-evidence
  semgrep:
    name: Semgrep
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep==1.182.0
      - name: Semgrep rule tests
        run: semgrep --test --metrics=off .semgrep/rules
      - name: Semgrep scan
        run: semgrep scan --config .semgrep/rules --exclude .semgrep --error --metrics=off --sarif --output semgrep.sarif .
      - name: Upload SARIF
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: semgrep.sarif
