# Requires Python 3.10 or later. Hermes' plugin.yaml schema has no minimum-Python key
# (python_runtime only opts a plugin out of Hermes' venv), so the requirement is stated here.
name: ultrathink
version: 1.4.0
description: "Plans each prompt with the shared ultrathink engine. /ultrathink-quick <message> sends one message without planning."
author: "SWC Studio"
license: AGPL-3.0-or-later
provides_hooks:
  - pre_llm_call
  - transform_tool_result
  - post_tool_call
  - pre_verify
  - subagent_start
  - post_llm_call
  - on_session_finalize
provides_tools:
  - ultrathink_lesson_save
  - ultrathink_lesson_recall
