[project]
name = "ultrathink"
version = "1.21.1"
description = "Prime Agent bridge to the ultrathink planner (Prompt Uplift + Graph of Thought + HITL questions, tracked in Linear/Notion). Calls the shared TypeScript engine of claude-ultrathink."
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = []

[project.scripts]
ultrathink = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultrathink"]
